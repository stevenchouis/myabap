# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: fe01connectiontest
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://a396c05d-a792-494b-a9f2-5b3f674def78.abap.ap21.hana.ondemand.com
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZFE10_NOTE_APP
          description: Deploy fe10 Note App
          package: ZRAPCLOUD
          transport: ''
        exclude:
          - /test/
          - /localService/
